services:
  db:
    image: postgres:18-alpine
    container_name: fedy-db
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: fedy
      POSTGRES_PASSWORD: fedy
      POSTGRES_DB: fedy
    command: ["postgres", "-c", "port=5433"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedy -p 5433"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
